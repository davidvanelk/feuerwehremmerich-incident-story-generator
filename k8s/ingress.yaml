apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: incident-story-generator
  namespace: incident-story-generator
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - story-generator.example.com
      secretName: incident-story-generator-tls
  rules:
    - host: story-generator.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: incident-story-generator
                port:
                  name: http
