apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-story-generator
  namespace: incident-story-generator
  labels:
    app.kubernetes.io/name: incident-story-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-story-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-story-generator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: nginx
          image: nginx:1.31-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: basic-auth
              mountPath: /etc/nginx/auth
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: site
          configMap:
            name: site
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: basic-auth
          secret:
            secretName: nginx-basic-auth
            items:
              - key: .htpasswd
                path: .htpasswd
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
