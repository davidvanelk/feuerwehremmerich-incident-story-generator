apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: incident-story-generator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/davidvanelk/feuerwehremmerich-incident-story-generator.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: incident-story-generator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
